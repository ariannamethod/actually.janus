<meta charset="utf-8">
<title>JANUS</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* layout: one horizontal tape of sentences passing through a fixed slit at screen centre;
     the ledger (right, or bottom on phones) narrates seams, expectations and rereadings.
     Dark by choice — wet slate, the same family as REBECCA. */
  :root{
    --slate:#131517;   /* ground */
    --ink:#d7cbb3;     /* bone — words */
    --amber:#d3a24a;   /* fulfilled expectation, evidence */
    --oxide:#7aa8a0;   /* contradiction, crack */
    --ghost:#44474a;   /* erased, palimpsest */
    --margin:#8b8273;  /* ledger text */
    --line:rgba(215,203,179,.09);
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    color-scheme:dark;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--slate);color:var(--ink);font-family:var(--serif);overflow:hidden;
    padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
  #c{position:fixed;inset:0;display:block;touch-action:none;cursor:grab}
  #c.drag{cursor:grabbing}
  #title{position:fixed;left:max(22px,env(safe-area-inset-left,0px));top:calc(18px + env(safe-area-inset-top,0px));
    pointer-events:none;letter-spacing:.32em;font-size:12px;opacity:.75}
  #title b{font-weight:400;display:block;letter-spacing:.44em;font-size:14px;margin-bottom:6px}
  #title span{display:block;letter-spacing:.06em;font-size:10.5px;font-style:italic;opacity:.55;max-width:36ch;line-height:1.5}
  #mode{position:fixed;right:calc(320px + max(16px,env(safe-area-inset-right,0px)));top:calc(22px + env(safe-area-inset-top,0px));
    font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--margin);opacity:.7;pointer-events:none;text-transform:uppercase}
  #ledger{position:fixed;right:0;top:0;bottom:0;width:300px;
    padding:calc(64px + env(safe-area-inset-top,0px)) max(26px,env(safe-area-inset-right,0px)) 110px 22px;pointer-events:none;
    border-left:1px solid var(--line);
    background:linear-gradient(90deg,rgba(19,21,23,0) 0,rgba(19,21,23,.88) 40px);
    display:flex;flex-direction:column;justify-content:flex-end;gap:7px;
    font-style:italic;font-size:12.5px;line-height:1.45;color:var(--margin)}
  #ledger .h{position:absolute;top:calc(26px + env(safe-area-inset-top,0px));right:max(26px,env(safe-area-inset-right,0px));
    font-style:normal;letter-spacing:.3em;font-size:10px;opacity:.5}
  .ln{white-space:pre-wrap}
  .ln .t{font-style:normal;opacity:.55;font-size:10.5px;letter-spacing:.06em;margin-right:8px;font-family:var(--mono)}
  .ln.ev{color:var(--amber)}.ln.co{color:var(--oxide)}.ln.dead{color:var(--ghost)}.ln.born{color:var(--ink)}
  #bar{position:fixed;left:0;right:300px;bottom:0;
    padding:12px max(22px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(22px,env(safe-area-inset-left,0px));
    display:flex;gap:10px;align-items:center;flex-wrap:wrap;
    background:linear-gradient(180deg,rgba(19,21,23,0),rgba(19,21,23,.92) 40%)}
  #prompt{flex:1;min-width:160px;font:inherit;font-size:15px;padding:9px 12px;background:rgba(215,203,179,.04);
    color:var(--ink);border:1px solid var(--line);border-radius:2px;outline:none}
  #prompt:focus{border-color:var(--margin)}
  #prompt::placeholder{color:var(--margin);font-style:italic}
  button{font:inherit;font-size:11px;letter-spacing:.22em;text-transform:uppercase;padding:9px 13px;background:transparent;
    color:var(--margin);border:1px solid var(--line);border-radius:2px;cursor:pointer}
  button:hover:not(:disabled),button:focus-visible{color:var(--ink);border-color:var(--margin);outline:none}
  button:disabled{opacity:.35;cursor:default}
  button.main{color:var(--ink);border-color:rgba(215,203,179,.3)}
  #file{display:none}
  #hint{position:fixed;left:max(22px,env(safe-area-inset-left,0px));bottom:calc(72px + env(safe-area-inset-bottom,0px));
    font-size:11px;font-style:italic;opacity:.35;letter-spacing:.04em;pointer-events:none;transition:opacity 4s}
  #tip{position:fixed;pointer-events:none;font-size:12px;font-style:italic;color:var(--ink);
    background:rgba(19,21,23,.9);padding:6px 9px;border:1px solid rgba(215,203,179,.14);max-width:38ch;line-height:1.4;display:none;z-index:3}
  #tip .k{font-style:normal;font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--margin)}
  #drop{position:fixed;inset:0;border:2px dashed var(--amber);display:none;z-index:6;pointer-events:none}
  @media (max-width:820px){
    #ledger{width:100%;top:auto;height:30vh;bottom:calc(74px + env(safe-area-inset-bottom,0px));
      padding:12px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-left:0;border-top:1px solid var(--line);
      background:linear-gradient(180deg,rgba(19,21,23,0) 0,rgba(19,21,23,.92) 26px);font-size:11.5px}
    #ledger .h{display:none}
    #title span{display:none}
    #mode{right:max(16px,env(safe-area-inset-right,0px))}
    #bar{right:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
    #hint{bottom:calc(30vh + 80px + env(safe-area-inset-bottom,0px))}
  }
  @media (prefers-reduced-motion:reduce){ #hint{transition:none} }
</style>

<canvas id="c"></canvas>
<div id="title"><b>JANUS</b>a door that time passes through in both directions<span>the field reads a corpus forward and backward; what comes after chooses what came before</span></div>
<div id="mode">field · no weights</div>
<div id="ledger"><div class="h">LEDGER</div><div id="log"></div></div>
<div id="hint">drag — scrub the tape · tap a word — its history · hold a sentence — regrow it from its seam</div>
<div id="tip"></div>
<div id="drop"></div>
<div id="bar">
  <input id="prompt" type="text" placeholder="speak to janus…" autocomplete="off" maxlength="400">
  <button id="go" class="main">resonate</button>
  <button id="corpus" title="drop or pick a .txt — the field is rebuilt from it">corpus</button>
  <input id="file" type="file" accept=".txt,text/plain">
</div>

<script>
(()=>{
'use strict';
/* ───────────── canvas ───────────── */
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const logEl=document.getElementById('log'),tipEl=document.getElementById('tip'),hintEl=document.getElementById('hint'),modeEl=document.getElementById('mode');
let W=1,H=1,AW=1,DPR=1,mobile=false;
function resize(){DPR=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;mobile=W<=820;AW=mobile?W:W-300;
  cv.width=W*DPR;cv.height=H*DPR;cv.style.width=W+'px';cv.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0);}
addEventListener('resize',resize);resize();
const reduced=matchMedia('(prefers-reduced-motion:reduce)').matches;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
let seed=(Date.now()%2147483647)>>>0;
const rnd=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296;};
let now=0;
const mmss=t=>{const m=Math.floor(t/60),s=Math.floor(t%60);return m+':'+(s<10?'0':'')+s;};

/* ───────────── calendar drift (from ariannamethod.c) ───────────── */
const AM_ANNUAL_DRIFT=11.25,AM_GREGORIAN_YEAR=365.25,AM_METONIC_YEARS=19,AM_METONIC_LEAPS=7,AM_MAX_UNCORRECTED=33.0;
const METONIC_LEAP_YEARS=[3,6,8,11,14,17,19];
const EPOCH=new Date(2024,9,3,12,0,0);
const calDays=()=>Math.floor((Date.now()-EPOCH.getTime())/86400000);
function calDrift(days){const years=days/AM_GREGORIAN_YEAR;let base=years*AM_ANNUAL_DRIFT;
  const full=Math.trunc(years/AM_METONIC_YEARS);let corr=full*AM_METONIC_LEAPS*30;
  const partial=years%AM_METONIC_YEARS;const yic=Math.trunc(partial)+1;
  for(let i=0;i<AM_METONIC_LEAPS;i++) if(METONIC_LEAP_YEARS[i]<=yic) corr+=30;return base-corr;}
const calDiss=days=>clamp(Math.abs(calDrift(days)%AM_MAX_UNCORRECTED)/AM_MAX_UNCORRECTED,0,1);
/* MetaJanus — the file remembers the day it was first opened in this browser */
let birthDays=calDays();
try{const b=localStorage.getItem('janus.birth');if(b!==null&&isFinite(+b))birthDays=+b;else localStorage.setItem('janus.birth',String(birthDays));}catch(e){}
const personalDiss=()=>clamp(Math.abs(calDrift(calDays())-calDrift(birthDays))/AM_MAX_UNCORRECTED,0,1);

/* ───────────── chambers (Kuramoto) ───────────── */
const CH={FEAR:0,LOVE:1,RAGE:2,VOID:3,FLOW:4,COMPLEX:5,N:6},CHN=['fear','love','rage','void','flow','cmplx'];
const chambers=new Float32Array(6),chDecay=[0.95,0.95,0.93,0.96,0.94,0.97];
function updateChambers(stepIdx,steps,debt){const d=stepIdx/steps;
  if(d<0.33)chambers[CH.FLOW]+=0.05;else if(d<0.66)chambers[CH.FEAR]+=0.04;else chambers[CH.VOID]+=0.05;
  if(d>0.75)chambers[CH.COMPLEX]+=0.03;if(debt>0.3)chambers[CH.RAGE]+=0.04;
  const K=0.02,old=Float32Array.from(chambers);
  for(let i=0;i<6;i++){for(let j=0;j<6;j++)if(i!==j)chambers[i]+=K*Math.sin(old[j]-old[i]);chambers[i]=clamp(chambers[i]*chDecay[i],0,1);}}

/* ───────────── tokens ─────────────
   word-level, punctuation as tokens. '.', '!', '?' are boundaries: the seams of time. */
const STOP=new Set("i me my we our you your he she it they them the a an and or but in on at to for of is am are was were be been being have has had do does did will would shall should can could may might must not no nor so if then than that this these those what which who whom how when where why all each every some any few many much more most other another such as by from with into its it's".split(' '));
const vocab=new Map(),words=[];
const tokId=w=>{let id=vocab.get(w);if(id===undefined){id=words.length;words.push(w);vocab.set(w,id);}return id;};
const isBoundary=t=>{const w=words[t];return w==='.'||w==='!'||w==='?';};
const isPunct=t=>{const w=words[t];return w.length===1&&!/[\p{L}\p{N}]/u.test(w)||w==='—';};
/* the corpus brings its own stop list: the short tokens that cover its first 1% of text (any alphabet) */
const CSTOP=new Set();
const isContent=t=>!isPunct(t)&&!STOP.has(words[t])&&!CSTOP.has(t)&&words[t].length>2;
function tokenize(text){const out=[];const re=/[\p{L}\p{N}][\p{L}\p{N}'’\-]*|[.!?]+|[,;:]|—|--/gu;let m;
  while((m=re.exec(text))){let s=m[0];if(/^[.!?]+$/.test(s))s=s[0];else if(s==='--')s='—';else s=s.toLowerCase().replace(/’/g,"'");out.push(tokId(s));}
  return out;}
function render(toks){let s='';for(const t of toks){const w=words[t];
  if(isPunct(t)&&w!=='—'){s+=w;}else{s+=(s?' ':'')+w;}}return s;}

/* ───────────── the field — both directions ───────────── */
const F={N:0,uni:[],succ:[],pred:[],triS:new Map(),triP:new Map(),heb:new Map(),bi:new Map(),tri:new Map(),sentences:[],ready:false};
const kb=(a,b)=>a*65536+b;
const kt=(a,b,c)=>(a*65536+b)*65536+c;
function inc(map,k){map.set(k,(map.get(k)||0)+1);}
function incList(arr,i,k){let m=arr[i];if(!m){m=new Map();arr[i]=m;}inc(m,k);}
function incNest(map,k,j){let m=map.get(k);if(!m){m=new Map();map.set(k,m);}inc(m,j);}
function buildField(text){
  F.uni=[];F.succ=[];F.pred=[];F.triS=new Map();F.triP=new Map();F.heb=new Map();F.bi=new Map();F.tri=new Map();F.sentences=[];
  const T=tokenize(text);F.N=T.length;
  for(const t of T)F.uni[t]=(F.uni[t]||0)+1;
  CSTOP.clear();{const cand=[];for(let t=0;t<words.length;t++)if(F.uni[t]&&!isPunct(t)&&words[t].length<=4&&words[t].length>2)cand.push(t);
    cand.sort((a,b)=>F.uni[b]-F.uni[a]);let cov=0;for(const t of cand){if(cov>=0.01*F.N&&CSTOP.size>=8)break;CSTOP.add(t);cov+=F.uni[t];}}
  for(let i=0;i<T.length;i++){
    if(i+1<T.length){inc(F.bi,kb(T[i],T[i+1]));incList(F.succ,T[i],T[i+1]);incList(F.pred,T[i+1],T[i]);}
    if(i+2<T.length){inc(F.tri,kt(T[i],T[i+1],T[i+2]));incNest(F.triS,kb(T[i],T[i+1]),T[i+2]);incNest(F.triP,kb(T[i+1],T[i+2]),T[i]);}
    if(isContent(T[i]))for(let j=i+1;j<T.length&&j<=i+8;j++){if(!isContent(T[j]))continue;const a=T[i],b=T[j];inc(F.heb,a<b?kb(a,b):kb(b,a));}
  }
  let s=[];for(const t of T){s.push(t);if(isBoundary(t)){if(s.length>=4)F.sentences.push(s);s=[];}}
  F.ready=true;
}
const bi=(a,b)=>F.bi.get(kb(a,b))||0, tri=(a,b,c)=>F.tri.get(kt(a,b,c))||0;
const heb=(a,b)=>F.heb.get(a<b?kb(a,b):kb(b,a))||0;
const ln1=x=>Math.log(1+x);
function hebCtx(t,context){if(!isContent(t)||!context.length)return 0;let s=0;for(const c of context)s+=ln1(heb(c,t));return s/Math.sqrt(context.length);}
const common=t=>(F.uni[t]||0)/F.N>0.01;

/* candidate scoring, forward: next after (p2,p1); backward: previous before (n1,n2) */
function candidates(dir,a,b,context,sent,recent,temp){
  const pool=new Map();
  const nest=dir>0?F.triS.get(kb(a,b)):F.triP.get(kb(a,b));
  if(nest)for(const [t,c] of nest)pool.set(t,1.4*ln1(c));
  const lst=dir>0?F.succ[b]:F.pred[a];
  if(lst)for(const [t,c] of lst)pool.set(t,(pool.get(t)||0)+0.8*ln1(c));
  if(pool.size<4){for(const c of context){const lst2=dir>0?F.succ[c]:F.pred[c];if(lst2)for(const [t,cnt] of lst2)if(!pool.has(t))pool.set(t,0.2*ln1(cnt));}}
  const out=[];
  for(const [t,base] of pool){let s=base+0.55*hebCtx(t,context);
    if(common(t)&&!isPunct(t))s-=0.5;
    if(isContent(t)){if(sent.includes(t))s-=1.8;else if(recent.has(t))s-=1.1;}
    out.push({t,s:s/temp});}
  out.sort((x,y)=>y.s-x.s);return out;}
function sample(cands){const top=cands.slice(0,12);if(!top.length)return -1;
  const mx=top[0].s;let sum=0;for(const c of top){c.p=Math.exp(c.s-mx);sum+=c.p;}
  let acc=0;const thr=0.85*sum;const nuc=[];for(const c of top){nuc.push(c);acc+=c.p;if(acc>=thr)break;}
  let r=rnd()*acc,cum=0;for(const c of nuc){cum+=c.p;if(cum>=r)return c.t;}return nuc[0].t;}

/* grow one sentence. forward: from seed tokens outward; backward: from the seam inward, last word first */
function growForward(seedToks,context,recent,temp){const sent=[];const MAX=24;
  let p2=seedToks.length>1?seedToks[seedToks.length-2]:seedToks[0],p1=seedToks[seedToks.length-1];
  for(let i=0;i<MAX;i++){const c=candidates(1,p2,p1,context,sent,recent,temp);
    let t=sample(c);if(t<0)break;
    if(isBoundary(t)){if(sent.length<4){const c2=c.filter(x=>!isBoundary(x.t));t=sample(c2);if(t<0)break;}else{sent.push(t);return sent;}}
    sent.push(t);p2=p1;p1=t;}
  if(!sent.length)return sent;if(!isBoundary(sent[sent.length-1]))sent.push(tokId('.'));return sent;}
function growBackward(seamToks,context,recent,temp){const sent=[];const MAX=18;
  /* seam: (boundary, first word of the following sentence) */
  let n1=tokId('.'),n2=seamToks[0];
  for(let i=0;i<MAX;i++){const c=candidates(-1,n1,n2,context,sent,recent,temp);
    let t=sample(c);if(t<0)break;
    if(isBoundary(t)){if(sent.length<4){const c2=c.filter(x=>!isBoundary(x.t));t=sample(c2);if(t<0)break;}else break;}
    sent.unshift(t);n2=n1;n1=t;}
  if(sent.length)sent.push(tokId('.'));return sent;}

/* does a candidate merely repeat a sentence already on the tape? (content overlap) */
function echoes(sent){const a=new Set(sent.filter(isContent));if(a.size<2)return false;
  for(const s of T.S.values()){const b=new Set(s.toks.filter(isContent));if(!b.size)continue;let both=0;for(const t of a)if(b.has(t))both++;
    if(both/Math.min(a.size,b.size)>=0.6)return true;}return false;}
/* scores: how a sentence reads forward, and how well a seam holds */
function internal(sent){if(sent.length<3)return 0;let s=0;
  for(let i=2;i<sent.length;i++)s+=ln1(tri(sent[i-2],sent[i-1],sent[i]))+0.5*ln1(bi(sent[i-1],sent[i]));
  return s/(sent.length-2);}
const edge=(sent,side,n)=>{const c=sent.filter(isContent);return side<0?c.slice(0,n):c.slice(-n);};
function seamScore(left,right){if(!left||!right)return 0;
  const last=left[left.length-1];const bnd=isBoundary(last)?last:tokId('.');const lk=isBoundary(last)?left[left.length-2]:last;const h1=right[0];
  let s=ln1(tri(lk,bnd,h1))+0.3*ln1(bi(lk,bnd));
  const a=edge(left,1,4),b=edge(right,-1,4);let hs=0,n=0;for(const x of a)for(const y of b){hs+=ln1(heb(x,y));n++;}
  return s+(n?0.8*hs/n:0);}

/* ───────────── the tape ─────────────
   S[k] for k in [-nb..nf]; k=0 is the origin. x: seam between S[-1] and S[0] is world 0. */
const T={S:new Map(),nb:0,nf:0,debt:0,marks:[],camX:0,camTarget:0,dragT:-1e9,step:0,busy:false,log:[]};
const GAP=30,FONT='17px "Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif';
function measure(toks){ctx.font=FONT;const ws=[];let x=0;for(let i=0;i<toks.length;i++){const w=words[toks[i]];const pw=isPunct(toks[i])&&w!=='—';
  const text=(i>0&&!pw?' ':'')+w;const wd=ctx.measureText(text).width;ws.push({x,w:wd,text});x+=wd;}return {ws,width:x};}
function mkSentence(k,toks,user){const m=measure(toks);
  return {k,toks,ws:m.ws,width:m.width,user:!!user,born:now,revealed:user?toks.length:0,revT:now,label:'plain',hist:[],layers:[],seamL:0,seamR:0,conn:0,flip:-1e9};}
function layout(){let x=0;for(let k=0;k<=T.nf;k++){const s=T.S.get(k);if(!s)break;s.x0=x;x+=s.width+GAP;}
  x=0;for(let k=-1;k>=-T.nb;k--){const s=T.S.get(k);if(!s)break;x-=s.width+GAP;s.x0=x;}}
const chainRecent=()=>{const r=new Set();for(const s of T.S.values())for(const t of s.toks)if(isContent(t))r.add(t);return r;};
const chainContext=()=>{const c=[];for(const s of T.S.values())for(const t of s.toks)if(isContent(t))c.push(t);return c.slice(-24);};

/* ───────────── ledger ───────────── */
function say(text,cls){T.log.push({t:now,text,cls});if(T.log.length>60)T.log.shift();
  const n=Math.min(T.log.length,mobile?6:16);logEl.innerHTML='';
  T.log.slice(-n).forEach((l,i)=>{const d=document.createElement('div');d.className='ln '+(l.cls||'');
    d.style.opacity=(0.3+0.7*(i/Math.max(1,n-1))).toFixed(2);d.innerHTML='<span class="t">'+mmss(l.t)+'</span>'+l.text;logEl.appendChild(d);});}
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const sName=k=>k===0?'origin':(k<0?'S'+k:'S+'+k);

/* ───────────── rereading: the past under the pressure of the present ───────────── */
function reread(stepTag){const ks=[...T.S.keys()].sort((a,b)=>a-b);if(ks.length<2)return;
  let avg=0,n=0;
  for(const k of ks){const s=T.S.get(k),L=T.S.get(k-1),R=T.S.get(k+1);
    s.seamL=L?seamScore(L.toks,s.toks):0;s.seamR=R?seamScore(s.toks,R.toks):0;
    const sides=(L?1:0)+(R?1:0);s.conn=sides?(s.seamL+s.seamR)/sides:0;if(sides){avg+=s.conn;n++;}}
  if(!n)return;avg/=n;let logged=0;
  for(const k of ks){const s=T.S.get(k);if(s.user||s.conn===0&&!(T.S.has(k-1)||T.S.has(k+1)))continue;
    const h=s.label==='evidence'?0.1:s.label==='contra'?-0.1:0;const r=s.conn/(avg+1e-6);
    let label='plain';if(r>0.9-h)label='evidence';else if(r<0.45-h)label='contra';
    if(label!==s.label){s.hist.push({t:now,step:stepTag,from:s.label,to:label});s.label=label;s.flip=now;
      if(logged<2){logged++;say(sName(k)+' reread · '+s.hist[s.hist.length-1].from+' → '+label+(label==='contra'?' — its seams no longer hold':''),label==='evidence'?'ev':label==='contra'?'co':'');}}}}

/* ───────────── expectations: a forecast must meet a witness later ───────────── */
function expect(dir,neighbor,context){
  const recent=chainRecent();let c;
  if(dir>0){const nt=neighbor.toks,last=nt[nt.length-1];const bnd=isBoundary(last)?last:tokId('.');const lk=isBoundary(last)?nt[nt.length-2]:last;c=candidates(1,lk,bnd,context,[],recent,1);}
  else{c=candidates(-1,tokId('.'),neighbor.toks[0],context,[],recent,1);}
  c=c.filter(x=>isContent(x.t));if(!c.length)return null;
  return {t:c[0].t,max:c[0].s,all:new Map(c.slice(0,40).map(x=>[x.t,x.s]))};}
function witness(exp,sent,dir){if(!exp)return 0;
  const e=dir>0?edge(sent,-1,5):edge(sent,1,5);const actual=dir>0?edge(sent,-1,1)[0]:edge(sent,1,1)[0];
  const fulfilled=e.includes(exp.t);let gap=0;
  if(!fulfilled){const sc=actual!==undefined&&exp.all.has(actual)?exp.all.get(actual):-1e9;gap=clamp(1-Math.exp(sc-exp.max),0,1);}
  return {fulfilled,gap};}

/* ───────────── one step of the chain ───────────── */
function tempNow(dir,i,steps){const d=calDiss(calDays());let base=0.72+0.08*d+0.1*T.debt;
  base*=1+0.2*chambers[CH.VOID]+0.1*chambers[CH.FEAR]-0.1*chambers[CH.LOVE];
  base*=dir>0?(1-0.015*i):(1+0.03*i);return clamp(base,0.45,1.15);}
function step(dir,i,steps){
  const k=dir>0?T.nf+1:-(T.nb+1);const neighbor=T.S.get(dir>0?T.nf:-T.nb);
  const context=chainContext(),recent=chainRecent();updateChambers(T.step,steps,T.debt);
  const exp=expect(dir,neighbor,context);
  if(exp){T.marks.push({k,dir,word:words[exp.t],state:'open',t0:now});}
  const temp=tempNow(dir,i,steps);let best=null,bs=-1e9,fallback=null,fs=-1e9;
  for(let c=0;c<5;c++){
    const sent=dir>0?growForward(neighbor.toks.slice(-3),context,recent,temp):growBackward(neighbor.toks,context,recent,temp);
    if(sent.length<4)continue;
    const sc=dir>0?internal(sent)+0.7*seamScore(neighbor.toks,sent):0.85*internal(sent)+seamScore(sent,neighbor.toks);
    if(sc>fs){fs=sc;fallback=sent;}
    if(echoes(sent))continue; /* a sentence the tape already holds is not a new step */
    if(sc>bs){bs=sc;best=sent;}}
  if(!best)best=fallback;
  if(!best){best=F.sentences[Math.floor(rnd()*F.sentences.length)].slice();}
  const s=mkSentence(k,best,false);if(dir>0)T.nf=k;else T.nb=-k;T.S.set(k,s);layout();
  const seam=dir>0?seamScore(neighbor.toks,best):seamScore(best,neighbor.toks);
  const w=witness(exp,best,dir);
  const mk=T.marks[T.marks.length-1];
  if(exp&&mk){if(w.fulfilled){mk.state='filled';T.debt=0.9*T.debt;say(sName(k)+' '+(dir>0?'↓':'↑')+' expected “'+words[exp.t]+'” and it came · debt '+T.debt.toFixed(2),'ev');}
    else{mk.state='cracked';T.debt=0.9*T.debt+0.1*w.gap;say(sName(k)+' '+(dir>0?'↓':'↑')+' expected “'+words[exp.t]+'” — it did not come · gap '+w.gap.toFixed(2)+' · debt '+T.debt.toFixed(2),'co');}}
  say(sName(k)+(dir>0?' grew forward from the seam':' grew backward into the seam')+' · seam '+seam.toFixed(2)+(dir<0?' — last word chosen first':''),'born');
  T.step++;reread(T.step);
}

/* SPA-lite: after the chain, weakly connected sentences are regrown from their seam; the old text stays as a layer */
function regrow(k,why){const s=T.S.get(k);if(!s||s.user)return false;
  const L=T.S.get(k-1),R=T.S.get(k+1);if(!L&&!R)return false;
  const context=chainContext(),recent=chainRecent();const before=s.conn;let best=null,bs=-1e9;
  for(let c=0;c<4;c++){let sent;
    if(k>0&&L)sent=growForward(L.toks.slice(-3),context,recent,0.8);else if(k<0&&R)sent=growBackward(R.toks,context,recent,0.8);else continue;
    if(sent.length<4)continue;
    const sc=(L?seamScore(L.toks,sent):0)+(R?seamScore(sent,R.toks):0)+0.5*internal(sent);
    if(sc>bs){bs=sc;best=sent;}}
  if(!best)return false;
  const sidesN=(L?1:0)+(R?1:0);const newConn=((L?seamScore(L.toks,best):0)+(R?seamScore(best,R.toks):0))/sidesN;
  if(newConn<=before*1.05&&why!=='held'){say(sName(k)+' tried to regrow — nothing held better · kept','');return false;}
  s.layers.push({toks:s.toks,ws:s.ws,width:s.width,t:now});
  const m=measure(best);s.toks=best;s.ws=m.ws;s.width=m.width;s.revealed=0;s.revT=now;s.born=now;
  s.hist.push({t:now,step:T.step,from:s.label,to:'regrown'});s.label='plain';s.flip=now;layout();
  say(sName(k)+' regrown from its seam ('+why+') · '+before.toFixed(2)+' → '+newConn.toFixed(2)+' · the old sentence stays beneath','born');
  reread(T.step);return true;}

/* ───────────── the chain ───────────── */
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function runChain(text){if(!F.ready||T.busy)return;T.busy=true;setButtons();
  T.S.clear();T.nb=0;T.nf=0;T.marks=[];T.camX=0;T.camTarget=0;T.step=0;
  let toks=tokenize(text).filter(t=>true);let user=true;
  if(toks.length<2){toks=F.sentences[Math.floor(rnd()*F.sentences.length)].slice();user=false;say('nothing was said · the origin is taken from the corpus','');}
  if(!isBoundary(toks[toks.length-1]))toks.push(tokId('.'));
  if(user){/* the field hears you: your words enter the metaweights */
    for(let i=0;i+1<toks.length;i++){inc(F.bi,kb(toks[i],toks[i+1]));incList(F.succ,toks[i],toks[i+1]);incList(F.pred,toks[i+1],toks[i]);
      if(i+2<toks.length){inc(F.tri,kt(toks[i],toks[i+1],toks[i+2]));incNest(F.triS,kb(toks[i],toks[i+1]),toks[i+2]);incNest(F.triP,kb(toks[i+1],toks[i+2]),toks[i]);}}
    for(let i=0;i<toks.length;i++)if(isContent(toks[i]))for(let j=i+1;j<toks.length&&j<=i+8;j++)if(isContent(toks[j])){const a=toks[i],b=toks[j];inc(F.heb,a<b?kb(a,b):kb(b,a));}
    F.N+=toks.length;for(const t of toks)F.uni[t]=(F.uni[t]||0)+1;}
  const o=mkSentence(0,toks,user);T.S.set(0,o);layout();
  const d=calDays(),cd=calDiss(d),pd=personalDiss();
  const STEPS=12;const nb=clamp(Math.round(STEPS*(0.3+0.4*T.debt+0.1*cd)),1,STEPS-1),nf=STEPS-nb;
  say('origin set · drift '+calDrift(d).toFixed(2)+' · dissonance '+cd.toFixed(3)+' · personal '+pd.toFixed(3)+' → '+nb+' steps back, '+nf+' forward','');
  const order=[];for(let i=0;i<Math.max(nb,nf);i++){if(i<nb)order.push(-1);if(i<nf)order.push(1);}
  let ib=0,ifw=0;
  for(const dir of order){const i=dir>0?ifw++:ib++;step(dir,i,STEPS);
    const s=T.S.get(dir>0?T.nf:-T.nb);T.camTarget=s.x0+s.width/2;
    await sleep(reduced?200:120*s.toks.length+300);}
  /* SPA: bidirectional sentence attention — the weak seams are regrown */
  const ks=[...T.S.keys()];let avg=0,n=0;for(const k of ks){const s=T.S.get(k);if(!s.user){avg+=s.conn;n++;}}avg/=Math.max(1,n);
  let re=0;for(const k of ks){const s=T.S.get(k);if(!s.user&&s.conn<0.6*avg&&re<3){if(regrow(k,'weak seam')){re++;T.camTarget=s.x0+s.width/2;await sleep(reduced?200:1200);}}}
  say('chain closed · '+(T.nb+T.nf)+' steps · debt '+T.debt.toFixed(3)+' · '+T.marks.filter(m=>m.state==='cracked').length+' expectations still open as cracks','');
  T.camTarget=0;T.busy=false;setButtons();}

/* ───────────── drawing ───────────── */
function sentColor(s,a){return s.label==='evidence'?`rgba(211,162,74,${a})`:s.label==='contra'?`rgba(122,168,160,${a})`:`rgba(215,203,179,${a})`;}
function draw(t){ctx.fillStyle='#131517';ctx.fillRect(0,0,W,H);
  const g=ctx.createRadialGradient(AW/2,H/2,H*0.2,AW/2,H/2,H*0.95);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.45)');
  ctx.fillStyle=g;ctx.fillRect(0,0,AW,H);
  const cy=mobile?H*0.36:H*0.5,sx=AW/2;const toX=x=>sx+(x-T.camX);
  /* the two calendars: one grid of 365.25, one of 354, drifting against each other */
  {const sG=38,sH=sG*354/365.25,ph=calDrift(calDays())*2.2;const band=56;
   ctx.lineWidth=1;const x0=T.camX-sx-40,x1=T.camX+sx+40;
   const grad=ctx.createLinearGradient(0,cy-band,0,cy+band);grad.addColorStop(0,'rgba(215,203,179,0)');grad.addColorStop(.5,'rgba(215,203,179,.07)');grad.addColorStop(1,'rgba(215,203,179,0)');
   ctx.strokeStyle=grad;ctx.beginPath();
   for(let x=Math.floor(x0/sG)*sG;x<x1;x+=sG){const px=toX(x);ctx.moveTo(px,cy-band);ctx.lineTo(px,cy+band);}
   for(let x=Math.floor((x0-ph)/sH)*sH+ph;x<x1;x+=sH){const px=toX(x);ctx.moveTo(px,cy-band);ctx.lineTo(px,cy+band);}
   ctx.stroke();}
  /* the tape */
  ctx.strokeStyle='rgba(215,203,179,.12)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(0,cy+14);ctx.lineTo(AW,cy+14);ctx.stroke();
  ctx.font=FONT;ctx.textBaseline='alphabetic';ctx.lineJoin='round';ctx.lineCap='round';
  const ks=[...T.S.keys()].sort((a,b)=>a-b);
  /* palimpsest: regrown sentences keep their old text beneath */
  for(const k of ks){const s=T.S.get(k);for(let i=0;i<s.layers.length;i++){const L=s.layers[i];const age=now-L.t;const a=clamp(0.3-age/400,0.06,0.3);
    ctx.fillStyle=`rgba(120,124,128,${a})`;for(const w of L.ws){const px=toX(s.x0+w.x);if(px<-200||px>AW+200)continue;ctx.fillText(w.text,px,cy+32+i*16);}
    ctx.strokeStyle=`rgba(120,124,128,${a*.7})`;ctx.setLineDash([2,5]);ctx.beginPath();ctx.moveTo(toX(s.x0),cy+36+i*16);ctx.lineTo(toX(s.x0+L.width),cy+36+i*16);ctx.stroke();ctx.setLineDash([]);}}
  /* seams: a bridge whose weight is how well the seam holds */
  for(const k of ks){const s=T.S.get(k),R=T.S.get(k+1);if(!R)continue;const a=clamp(s.seamR/2.5,0,1);
    const x1=toX(s.x0+s.width+6),x2=toX(R.x0-6);if(x2<-50||x1>AW+50)continue;
    ctx.strokeStyle=`rgba(215,203,179,${0.1+0.55*a})`;ctx.lineWidth=0.6+2.4*a;ctx.beginPath();ctx.moveTo(x1,cy+14);ctx.quadraticCurveTo((x1+x2)/2,cy+14-6-10*a,x2,cy+14);ctx.stroke();}
  /* sentences */
  let nowWord=null;
  for(const k of ks){const s=T.S.get(k);
    if(s.revealed<s.toks.length&&now-s.revT>(reduced?0.02:0.11)){s.revealed++;s.revT=now;}
    const n=s.toks.length,shown=s.revealed;
    for(let i=0;i<n;i++){const w=s.ws[i];const visible=k<0?(i>=n-shown):(i<shown);if(!visible)continue;
      const px=toX(s.x0+w.x);if(px<-200||px>AW+200)continue;
      const sinceFlip=now-s.flip;const under=px<=sx&&px+w.w>sx;
      let a=s.user?0.95:0.78;if(s.label==='contra')a=0.7;
      ctx.fillStyle=under?'rgba(215,203,179,1)':sentColor(s,a);
      if(s.user){ctx.font='italic '+FONT;}else ctx.font=FONT;
      ctx.fillText(w.text,px,cy);
      if(under&&!isPunct(s.toks[i]))nowWord={s,i,px,w};
      if(sinceFlip<1.6&&i===(k<0?n-1:0)){const kk=sinceFlip/1.6;ctx.strokeStyle=sentColor(s,0.5*(1-kk));ctx.lineWidth=0.8;ctx.beginPath();ctx.arc(px+w.w/2,cy-6,6+kk*18,0,7);ctx.stroke();}}
    if(s.label==='contra'){const x1=toX(s.x0),x2=toX(s.x0+s.width);ctx.strokeStyle='rgba(122,168,160,.55)';ctx.lineWidth=0.7;
      ctx.beginPath();ctx.moveTo(x1,cy+7);for(let x=x1;x<x2;x+=9){ctx.lineTo(x+4.5,cy+9);ctx.lineTo(x+9,cy+7);}ctx.stroke();}
    if(s.hist.length){ctx.fillStyle='rgba(215,203,179,.3)';ctx.font='10px '+FONT.slice(5);ctx.fillText(sName(k)+' · reread ×'+s.hist.length,toX(s.x0),cy-22);}
    else{ctx.fillStyle='rgba(215,203,179,.22)';ctx.font='10px '+FONT.slice(5);ctx.fillText(sName(k),toX(s.x0),cy-22);}
    ctx.font=FONT;}
  /* expectations: hollow until a witness comes; filled if it came; cracked if it did not */
  for(const m of T.marks){const s=T.S.get(m.k);let x;if(s)x=m.dir>0?s.x0+s.width+GAP/2:s.x0-GAP/2;else x=m.dir>0?T.S.get(T.nf).x0+T.S.get(T.nf).width+GAP+30:T.S.get(-T.nb).x0-GAP-30;
    const px=toX(x);if(px<-80||px>AW+80)continue;const y=cy+14;
    if(m.state==='open'){const pul=1+0.15*Math.sin(t*3);ctx.strokeStyle='rgba(211,162,74,.8)';ctx.lineWidth=1;ctx.beginPath();ctx.arc(px,y,5*pul,0,7);ctx.stroke();
      ctx.fillStyle='rgba(211,162,74,.5)';ctx.font='italic 10px '+FONT.slice(5);ctx.textAlign='center';ctx.fillText(m.word,px,y+20);ctx.textAlign='left';}
    else if(m.state==='filled'){ctx.fillStyle='rgba(211,162,74,.85)';ctx.beginPath();ctx.arc(px,y,4.2,0,7);ctx.fill();}
    else{ctx.strokeStyle='rgba(122,168,160,.9)';ctx.lineWidth=1.1;ctx.beginPath();ctx.moveTo(px-4,y+4);ctx.lineTo(px+4,y-4);ctx.moveTo(px-4,y-4);ctx.lineTo(px+4,y+4);ctx.stroke();
      ctx.beginPath();ctx.moveTo(px,y+4);ctx.lineTo(px+1.5,y+12);ctx.lineTo(px-1,y+19);ctx.stroke();
      ctx.fillStyle='rgba(122,168,160,.45)';ctx.font='italic 10px '+FONT.slice(5);ctx.textAlign='center';ctx.fillText(m.word,px,y+31);ctx.textAlign='left';}
    ctx.font=FONT;}
  /* the slit — the door */
  ctx.strokeStyle='rgba(215,203,179,.5)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(sx,cy-44);ctx.lineTo(sx,cy-26);ctx.moveTo(sx,cy+24);ctx.lineTo(sx,cy+44);ctx.stroke();
  ctx.strokeStyle='rgba(215,203,179,.16)';ctx.beginPath();ctx.moveTo(sx,cy-120);ctx.lineTo(sx,cy-44);ctx.moveTo(sx,cy+44);ctx.lineTo(sx,cy+120);ctx.stroke();
  /* chambers under the slit */
  for(let i=0;i<6;i++){const v=chambers[i];const x=sx-22+i*8;ctx.fillStyle=`rgba(215,203,179,${0.12+0.5*v})`;ctx.fillRect(x,cy+60,3,-(2+18*v));}
  /* status */
  ctx.fillStyle='rgba(215,203,179,.28)';ctx.font='10.5px '+FONT.slice(5);
  const d=calDays();
  ctx.fillText(mmss(now)+' · drift '+calDrift(d).toFixed(2)+' · dissonance '+calDiss(d).toFixed(3)+' · personal '+personalDiss().toFixed(3)+' · debt '+T.debt.toFixed(3)+' · steps ↑'+T.nb+' ↓'+T.nf+(F.ready?' · corpus '+F.N.toLocaleString()+' tokens':' · reading corpus…'),22,(mobile?cy+100:H-112));
  if(nowWord){ctx.fillStyle='rgba(215,203,179,.5)';ctx.font='italic 11px '+FONT.slice(5);
    const h=nowWord.s.hist.map(x=>x.from+'→'+x.to).join(', ');
    ctx.fillText('now · '+sName(nowWord.s.k)+' · “'+nowWord.w.text.trim()+'” · '+nowWord.s.label+(h?' · '+h:''),22,(mobile?cy+84:H-128));}
  if(!T.S.size&&F.ready){ctx.fillStyle='rgba(215,203,179,.35)';ctx.font='italic 14px '+FONT.slice(5);ctx.textAlign='center';ctx.fillText('the tape is empty. say something, or say nothing and it will take a sentence from the corpus.',sx,cy+60);ctx.textAlign='left';}
}

/* ───────────── interaction ───────────── */
let press=null;
function wordAt(cx,cy0){const cy=mobile?H*0.36:H*0.5;if(Math.abs(cy0-cy+6)>24)return null;const sx=AW/2;
  for(const s of T.S.values()){for(let i=0;i<s.ws.length;i++){const w=s.ws[i];const px=sx+(s.x0+w.x-T.camX);if(cx>=px&&cx<=px+w.w)return {s,i,px,w};}}return null;}
cv.addEventListener('pointerdown',ev=>{if(ev.clientX>AW)return;press={x:ev.clientX,y:ev.clientY,cam:T.camX,t:now,moved:false};cv.classList.add('drag');cv.setPointerCapture(ev.pointerId);});
cv.addEventListener('pointermove',ev=>{if(press){const dx=ev.clientX-press.x;if(Math.abs(dx)>6)press.moved=true;
    if(press.moved){T.camX=press.cam-dx;T.camTarget=T.camX;T.dragT=now;}return;}
  const hit=wordAt(ev.clientX,ev.clientY);showTip(hit,ev.clientX,ev.clientY);});
function showTip(hit,x,y){if(!hit){tipEl.style.display='none';return;}const s=hit.s;
  const chain=s.hist.map(h=>'<span class="k">'+mmss(h.t)+'</span> '+h.from+' → '+h.to).join('<br>');
  tipEl.innerHTML='<span class="k">'+sName(s.k)+(s.user?' · yours':'')+' · seam ← '+s.seamL.toFixed(2)+' · seam → '+s.seamR.toFixed(2)+'</span><br>'+esc(render(s.toks))+'<br>'+(chain||'<span class="k">not reread yet</span>');
  tipEl.style.display='block';const tw=Math.min(300,W-24);tipEl.style.left=Math.min(x+14,W-tw-10)+'px';tipEl.style.top=(y+14)+'px';}
function release(ev){if(!press)return;const p=press;press=null;cv.classList.remove('drag');tipEl.style.display='none';
  if(p.moved)return;const held=now-p.t;const hit=wordAt(p.x,p.y);
  if(held>=0.45){if(hit&&!T.busy)regrow(hit.s.k,'held');return;}
  if(hit){showTip(hit,p.x,p.y);setTimeout(()=>{tipEl.style.display='none';},3500);}}
cv.addEventListener('pointerup',release);cv.addEventListener('pointercancel',release);
cv.addEventListener('pointerleave',()=>{tipEl.style.display='none';});

/* ───────────── corpus ───────────── */
const promptEl=document.getElementById('prompt'),goBtn=document.getElementById('go'),corpusBtn=document.getElementById('corpus'),fileEl=document.getElementById('file'),dropEl=document.getElementById('drop');
function setButtons(){goBtn.disabled=!F.ready||T.busy;corpusBtn.disabled=T.busy;}
function loadCorpus(text,name){F.ready=false;setButtons();modeEl.textContent='field · reading';
  setTimeout(()=>{vocab.clear();words.length=0;buildField(text);T.S.clear();T.nb=0;T.nf=0;T.marks=[];T.camX=0;T.camTarget=0;
    say('corpus '+esc(name)+' read · '+F.N.toLocaleString()+' tokens · '+F.sentences.length.toLocaleString()+' sentences · bigrams '+F.bi.size.toLocaleString()+' · trigrams '+F.tri.size.toLocaleString()+' · hebbian '+F.heb.size.toLocaleString()+' — both directions','born');
    modeEl.textContent='field · no weights';setButtons();},30);}
function embedded(){const b=document.getElementById('corpus-data').textContent.replace(/\s+/g,'');const bin=atob(b);const u=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new TextDecoder('utf-8').decode(u);}
corpusBtn.addEventListener('click',()=>fileEl.click());
fileEl.addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;const t=await f.text();if(t.length<200){say('refusal: a corpus needs at least 200 characters','co');return;}loadCorpus(t,f.name);});
addEventListener('dragover',e=>{e.preventDefault();dropEl.style.display='block';});
addEventListener('dragleave',e=>{if(!e.relatedTarget)dropEl.style.display='none';});
addEventListener('drop',async e=>{e.preventDefault();dropEl.style.display='none';const f=e.dataTransfer.files&&e.dataTransfer.files[0];if(!f)return;const t=await f.text();if(t.length<200)return;loadCorpus(t,f.name);});
async function submit(){const text=promptEl.value.trim();promptEl.value='';await runChain(text);}
promptEl.addEventListener('keydown',e=>{if(e.key==='Enter')submit();});goBtn.addEventListener('click',submit);

/* ───────────── loop ───────────── */
let last=performance.now();
function loop(ts){const dt=Math.min(0.1,(ts-last)/1000);last=ts;now+=dt;
  if(now-T.dragT>2.5){T.camX+=(T.camTarget-T.camX)*(reduced?1:Math.min(1,dt*2.2));}
  draw(ts/1000);
  if(press&&!press.moved&&now-press.t>0.45){ctx.strokeStyle='rgba(122,168,160,.6)';ctx.lineWidth=1;ctx.beginPath();ctx.arc(press.x,press.y,6+4*Math.sin(ts/120),0,7);ctx.stroke();}
  if(now>40)hintEl.style.opacity=0;
  requestAnimationFrame(loop);}
say('the tape is empty. the field is reading the corpus in both directions','');
setButtons();requestAnimationFrame(loop);
setTimeout(()=>{try{loadCorpus(embedded(),'q.txt');}catch(e){say('the embedded corpus could not be read: '+esc(String(e.message||e)),'co');}},50);
})();
</script>
